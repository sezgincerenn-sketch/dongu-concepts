<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Döngü · Alternatifler</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#1c1a17;font-family:Inter,system-ui,sans-serif;color:#e9e2d6}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.brand{font-weight:700;font-size:17px;letter-spacing:-.02em;color:#fff;text-decoration:none;margin-right:8px}.brand:hover{color:#F2A33A}
.tabs,.scen{display:flex;gap:4px;flex-wrap:wrap}
.tab,.chip{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border-radius:99px;border:1px solid rgba(255,255,255,.16);background:transparent;color:#e9e2d6;font:600 13px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.tab b{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.12);font-size:11px}
.tab[aria-pressed=true],.chip[aria-pressed=true]{background:#E68A06;border-color:#E68A06;color:#1c1a17}.tab[aria-pressed=true] b{background:rgba(0,0,0,.15)}
.tab:hover,.chip:hover{border-color:#E68A06}
.desc{font-size:13px;color:#a39a8e;margin-left:auto}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;color:#a39a8e}
.wrap{position:absolute;left:0;right:0;bottom:0;background:#fff}iframe{width:100%;height:100%;border:0;display:block}
</style>
</head>
<body>
<div id="top">
  <div class="bar"><a class="brand" href="site.html">Döngü</a><div class="tabs" id="tabs"></div><span class="desc" id="desc"></span></div>
  <div class="bar"><span class="lbl">SENARYO</span><div class="scen" id="scen"></div></div>
</div>
<div class="wrap" id="wrap"><iframe id="fr" title="Döngü alternatifi"></iframe></div>
<script>
var A=[['1','Power Dashboard','k1.html','Veri ve modül odaklı, widget panosu'],['2','Streamlined Flow','k2.html','Süreç odaklı, adım adım sade işlem'],['3','Calm Space','k3.html','Power Dashboard’un sade, ferah ve sakin hali']];
var DEMO={musteri:{ad:'Ayşe',soyad:'Kaya',tel:'532 418 22 07',tip:'tuzel',unvan:'Örnek Tekstil A.Ş.',no:'6480293817',vd:'Zincirlikuyu',musteri:true,rol:'yonetici',ana:true,via:'ib'},aday:{ad:'Emre',soyad:'Aydın',tel:'544 905 12 33',tip:'tuzel',unvan:'Aydın Mobilya Ltd. Şti.',no:'0581247730',vd:'İnegöl',musteri:false,rol:'yonetici',ana:true,via:'kayit'},alt:{ad:'Zeynep',soyad:'Demir',tel:'535 771 40 18',tip:'tuzel',unvan:'Örnek Tekstil A.Ş.',no:'6480293817',vd:'Zincirlikuyu',musteri:true,rol:'muhasebe',ana:false,via:'davet'}};
var S=[['giris','Giriş ekranı'],['kayit','Kayıt Ol'],['musteri','Müşteri · Yönetici'],['aday','Aday üye'],['alt','Alt kullanıcı · Muhasebe']];
var fr=document.getElementById('fr'),cur='1',sc=null;
window.addEventListener('message',function(e){var d=e.data;if(d&&d.dongu==='nav'&&typeof d.url==='string'){try{var u=new URL(d.url,location.href);if(u.origin===location.origin){if(/index\.html$|\/$/.test(u.pathname)){var h=u.hash.slice(1);if(h==='giris'||h==='kayit'){setScen(h,true);return}}location.href=u.href}}catch(x){}}});
function ls(k,v){try{if(v==null)localStorage.removeItem(k);else localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function setScen(k,noReload){sc=k;if(k==='giris'||k==='kayit'){ls('dongu-oturum',null);ls('dongu-acilis',{kv:k,t:Date.now()})}else ls('dongu-oturum',DEMO[k]);render();if(!noReload||true)fr.src=A[+cur-1][2]+'?t='+Date.now()}
function pick(k){cur=k;try{localStorage.setItem('dongu-alt',k)}catch(e){}history.replaceState(null,'','#'+k);fr.src=A[+k-1][2];render()}
function render(){var t=document.getElementById('tabs');t.innerHTML='';A.forEach(function(a){var b=document.createElement('button');b.className='tab';b.setAttribute('aria-pressed',a[0]===cur);b.innerHTML='<b>'+a[0]+'</b>'+a[1];b.onclick=function(){pick(a[0])};t.appendChild(b)});document.getElementById('desc').textContent=A[+cur-1][3];
var s=document.getElementById('scen');s.innerHTML='';S.forEach(function(x){var b=document.createElement('button');b.className='chip';b.setAttribute('aria-pressed',x[0]===sc);b.textContent=x[1];b.onclick=function(){setScen(x[0])};s.appendChild(b)});fit()}
function fit(){document.getElementById('wrap').style.top=document.getElementById('top').offsetHeight+'px'}
window.addEventListener('resize',fit);
document.addEventListener('keydown',function(e){if(e.altKey&&/^[1-3]$/.test(e.key))pick(e.key)});
(function(){var h=(location.hash||'').slice(1),s='1';try{s=localStorage.getItem('dongu-alt')||'1'}catch(e){}if(!/^[1-3]$/.test(s))s='1';if(/^[1-3]$/.test(h))s=h;cur=s;if(h==='giris'||h==='kayit'){sc=h;ls('dongu-oturum',null);ls('dongu-acilis',{kv:h,t:Date.now()});history.replaceState(null,'','#'+cur)}fr.src=A[+cur-1][2];render()})();
</script>
</body>
</html>
