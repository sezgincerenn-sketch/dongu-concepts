<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Döngü · Alternatifler</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#1c1a17;font-family:Inter,system-ui,sans-serif}
.bar{height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;box-sizing:border-box;color:#fff;overflow:hidden}
.brand{flex:none;font:700 17px/1 Inter,sans-serif;letter-spacing:-.02em}
.sub{font-size:13px;color:#a39a8e;font-weight:400;margin-left:8px}
.tabs{flex:none;display:flex;gap:4px;padding:4px;border-radius:10px;background:rgba(255,255,255,.08)}
.tab{display:flex;align-items:center;gap:8px;min-height:36px;padding:0 14px;border:0;border-radius:7px;background:transparent;color:#e9e2d6;font:600 14px Inter,sans-serif;cursor:pointer;white-space:nowrap}
.tab b{font-size:12px;opacity:.75}
.tab[aria-selected=true]{background:#E68A06;color:#1c1a17}
.desc{flex:1 1 auto;min-width:0;font-size:13px;color:#a39a8e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.open{flex:none;margin-left:auto;color:#E68A06;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
a.open:hover{color:#F2A33A}
.stage{position:absolute;top:56px;left:0;right:0;bottom:0;background:#fff}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none}
iframe.on{display:block}
@media (max-width:1100px){.sub,.desc,.open span{display:none}}
</style>
</head>
<body>
<div class="bar">
  <div class="brand">Döngü<span class="sub">Alternatifler</span></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <span class="desc" id="desc"></span>
  <a class="open" id="open" target="_blank" title="Yeni sekmede aç"><span>Yeni sekmede aç </span>↗</a>
</div>
<div class="stage" id="stage"></div>
<script>
var A=[['1','Power Dashboard','k1.html','Veri ve modül odaklı, widget panosu'],['2','Streamlined Flow','k2.html','Süreç odaklı, adım adım sade işlem'],['3','Yapay Zekâ Odaklı','k3.html','Asistan ve doğal dil komutları'],['4','Sade Pano','k4.html','K1’in koyu menülü, sadeleştirilmiş hali']];
var tabs=document.getElementById('tabs'),stage=document.getElementById('stage'),frames={};
A.forEach(function(a){var b=document.createElement('button');b.className='tab';b.setAttribute('role','tab');b.innerHTML='<b>'+a[0]+'</b>'+a[1];b.title=a[3];b.onclick=function(){pick(a[0])};b.id='t'+a[0];tabs.appendChild(b);});
function pick(k){var a=A.filter(function(x){return x[0]===k})[0]||A[0];k=a[0];
  if(!frames[k]){var f=document.createElement('iframe');f.src=a[2];f.title=a[1];stage.appendChild(f);frames[k]=f;}
  for(var i in frames)frames[i].className=i===k?'on':'';
  A.forEach(function(x){document.getElementById('t'+x[0]).setAttribute('aria-selected',x[0]===k)});
  document.getElementById('desc').textContent=a[3];document.getElementById('open').href=a[2];
  try{localStorage.setItem('dongu-alt',k);history.replaceState(null,'','#'+k)}catch(e){}}
document.addEventListener('keydown',function(e){if(e.altKey&&/^[1-4]$/.test(e.key))pick(e.key)});
var h=(location.hash||'').slice(1),s='1';try{s=localStorage.getItem('dongu-alt')||'1'}catch(e){}
pick(/^[1-4]$/.test(h)?h:s);
</script>
</body>
</html>
